<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Full-bleed D20 Icosahedron Silhouette -->
  <polygon
    points="32,2 59,17.5 59,46.5 32,62 5,46.5 5,17.5"
    fill="#0B0E0D"
    stroke="#4ADE80"
    stroke-width="3.5"
    stroke-linejoin="round"
  />
  <!-- Outer Facet Shading -->
  <polygon
    points="32,2 59,17.5 32,14"
    fill="#16A34A"
    fill-opacity="0.28"
  />
  <polygon
    points="59,17.5 59,46.5 49,43"
    fill="#16A34A"
    fill-opacity="0.18"
  />
  <polygon
    points="5,17.5 32,14 15,43"
    fill="#16A34A"
    fill-opacity="0.18"
  />
  <!-- Center Equilateral Triangle Face -->
  <polygon
    points="32,14 49,43 15,43"
    fill="#16A34A"
    fill-opacity="0.32"
    stroke="#4ADE80"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- Facet Ridge Lines -->
  <line x1="32" y1="2" x2="32" y2="14" stroke="#4ADE80" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="59" y2="17.5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="5" y2="17.5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="49" y1="43" x2="59" y2="17.5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="49" y1="43" x2="59" y2="46.5" stroke="#4ADE80" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="49" y1="43" x2="32" y2="62" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="15" y1="43" x2="5" y2="17.5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="15" y1="43" x2="5" y2="46.5" stroke="#4ADE80" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="15" y1="43" x2="32" y2="62" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Pure Vector "20" Numeral on Center Face (No Font Dependency) -->
  <!-- Digit "2" -->
  <path
    d="M23.5 31.2C23.5 29.4 25 28.2 27 28.2C29 28.2 30.3 29.4 30.3 31.1C30.3 32.4 29.5 33.4 27.9 34.7L23.6 38.2H30.6"
    stroke="#FFFFFF"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Digit "0" -->
  <rect
    x="33.5"
    y="28.2"
    width="6.8"
    height="10"
    rx="3.4"
    stroke="#FFFFFF"
    stroke-width="2.6"
  />
</svg>
