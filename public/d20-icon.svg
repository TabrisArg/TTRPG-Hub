<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0B0E0D"/>
  <!-- Outer Hexagon Silhouette of Icosahedron (D20) -->
  <polygon
    points="32,5 56,18.5 56,45.5 32,59 8,45.5 8,18.5"
    fill="#121715"
    stroke="#22C55E"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- Inner Equilateral Triangle Face -->
  <polygon
    points="32,16 47,42 17,42"
    fill="#16A34A"
    fill-opacity="0.22"
    stroke="#4ADE80"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <!-- Facet Ridge Lines Connecting Outer Vertices to Inner Triangle -->
  <line x1="32" y1="5" x2="32" y2="16" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="56" y2="18.5" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="8" y2="18.5" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="47" y1="42" x2="56" y2="18.5" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="47" y1="42" x2="56" y2="45.5" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="42" x2="32" y2="59" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="17" y1="42" x2="8" y2="18.5" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="17" y1="42" x2="8" y2="45.5" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="42" x2="32" y2="59" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- "20" Critical Roll Numeral on Center Face -->
  <text
    x="32"
    y="37.5"
    text-anchor="middle"
    fill="#E2E6E4"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-weight="800"
    font-size="11.5"
    letter-spacing="-0.5"
  >20</text>
</svg>
